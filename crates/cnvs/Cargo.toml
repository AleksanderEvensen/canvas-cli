[package]
name = "cnvs"
version = "0.1.0"
edition = "2021"

[features]
default = []
write-requests = ["cnvs-daemon/write-requests"]

[dependencies]
anyhow = "1"
base64 = "0.22"
comfy-table = "7"
cnvs-agents = { path = "../cnvs-agents" }
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
cnvs-config = { path = "../cnvs-config" }
cnvs-daemon = { path = "../cnvs-daemon" }
cnvs-protocol = { path = "../cnvs-protocol" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[lints]
workspace = true
