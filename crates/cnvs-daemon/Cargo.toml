[package]
name = "cnvs-daemon"
version = "0.1.0"
edition = "2021"

[features]
default = []
write-requests = []

[dependencies]
anyhow = "1"
base64 = "0.22"
cnvs-config = { path = "../cnvs-config" }
cnvs-protocol = { path = "../cnvs-protocol" }
dirs = "6"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }
tokio-tungstenite = "0.27"
url = "2"


[lints]
workspace = true
