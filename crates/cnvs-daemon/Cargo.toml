[package]
name = "cnvs-daemon"
version = "0.1.0"
edition = "2021"

[features]
default = []
write-requests = []

[dependencies]
http = "1"
libc = "0.2"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"
anyhow = "1"
base64 = "0.22"
cnvs-config = { path = "../cnvs-config" }
cnvs-protocol = { path = "../cnvs-protocol" }
dirs = "6"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "time", "sync", "rt"] }
tokio-tungstenite = "0.27"
url = "2"


[lints]
workspace = true

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
